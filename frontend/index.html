<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <title>Calculadora API</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="contenedor">

        <h1>Calculadora</h1>

        <input
            type="text"
            id="operador1"
            placeholder="Operador 1"
        >

        <input
            type="text"
            id="operador2"
            placeholder="Operador 2"
        >

        <select id="operacion">

            <option value="suma">
                Suma
            </option>

            <option value="resta">
                Resta
            </option>

            <option value="multiplicacion">
                Multiplicación
            </option>

            <option value="division">
                División
            </option>

        </select>

        <button onclick="calcular()">

            Calcular

        </button>

        <div id="resultado"></div>

    </div>

    <script src="app.js"></script>

</body>
</html>
